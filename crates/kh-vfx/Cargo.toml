[package]
name = "kh-vfx"
description = "Sora's visual effects, engine-free (glam, serde_json and std only): a Cascade-style particle evaluator with the Square Enix node modules, in KH3 conventions, driven by the fixed 60 Hz step. It produces draw lists (quads, ribbons, mesh instances); the host draws them. docs/sora-vfx-spec.md."
version.workspace = true
edition.workspace = true

[dependencies]
glam = { workspace = true }
# The effect pack (build/sora_pack/vfx/effects/*.json, tools/sora_vfx_pack.js) is JSON.
serde_json = "1"
