# Kingdom Hearts x Elden Ring: the mod's settings (er/mods/kh-er.ini, beside kh_er.dll).
# The file is read again while the game runs. The setup writes it once; after that it is yours.
#
# One "key = value" per line. Lines starting with # or ; are comments, and so is the rest of a line after " #" or " ;"
# (put a value in double quotes to keep those signs in it). [Sections] are only for layout: every key works in any
# section. A key that is not in the file has its shipped default; "key = 0" switches a default off, "key = 1" on.
# Lines starting with "# key = ..." below show a shipped default: remove the "# " and change the value to use one.

[Mod]
# mode: sora = Sora plays in place of the Tarnished
mode = sora
# ride: 1 = Sora rides lifts and moving floors (0 = off)
ride = 1
# w.clamp: collision: 1 = a push out of an overlap is cut short where it would go into something else (0 = off)
w.clamp = 0
# w.hits: 1 = the walls Sora's collision meets are written to er/logs/kh-er.log
w.hits = 1
# draw.axes, draw.sora: debug drawings (0 = off)
draw.axes = 0
draw.sora = 0

[Hud]
# hud.kh: 1 = Sora's HUD and menus
# hud.kh = 1
# hud.er: 0 = Elden Ring's HUD hidden part by part while Sora's is up (its compass and prompts stay); 1 = left whole
# hud.er = 0
# prompt.er_hide: 1 = Elden Ring's own action prompt box is hidden under KH3's reaction command
prompt.er_hide = 1

[Save]
# save.points_only: 1 = a character saves only at save points once it has saved at one
# save.points_only = 1
# savepoint.rest_events: 0 = a save point never runs Elden Ring's rest; sit (or 1) = when Sora sits; always = every time
savepoint.rest_events = 0

[Items]
# loot.kh: 1 = KH3 items drop from killed enemies
loot.kh = 1
# loot.gate: 1 = the gate: every other way an item reaches the player (chests, corpses, the ground) is turned into KH3's
loot.gate = 1
# loot.log: 1 = the gate writes what it sees to er/logs/kh-er.log
loot.log = 1
# boss.rewards: 1 = a beaten boss gives its KH3 reward once per character
# boss.rewards = 1
# boc.gate: 0 = Sora's outfits are in the camp menu without having talked to Boc; 1 = only after talking to him
boc.gate = 0

[Combat]
# finish.kh: 1 = KH3's finish on a boss
# finish.kh = 1
# break.kh: 1 = Sora's attacks break breakable objects, fire sets off explosives
# break.kh = 1

[Render]
# r.world_lights: 0 = no light of the world's on Sora
r.world_lights = 0
# r.hybrid: 1 = the hybrid: KH3's toon shading lit by Elden Ring's world light
r.hybrid = 1
